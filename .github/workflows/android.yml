name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../basal-cycle.apk
      - uses: actions/upload-artifact@v4
        with:
          name: basal-cycle-apk
          path: basal-cycle.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v1.0.${{ github.run_number }}
          gh release create "$TAG" basal-cycle.apk --title "Basal Cycle $TAG" \
            --notes "Android APK built from ${{ github.sha }}. Install basal-cycle.apk on your phone." --latest
